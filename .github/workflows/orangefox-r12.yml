name: Build OrangeFox R12

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  build:
    name: OrangeFox 12.1 / RE6402L1
    runs-on: ubuntu-22.04
    timeout-minutes: 345

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Create swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush python3 rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-17-jdk

      - name: Sync OrangeFox R12 source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git sync
          ./sync/orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"

      - name: Install device tree
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"
          mkdir -p device/realme/RE6402L1
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree/" \
            device/realme/RE6402L1/
          test -s device/realme/RE6402L1/prebuilt/kernel
          test -f device/realme/RE6402L1/AndroidProducts.mk
          test -f device/realme/RE6402L1/BoardConfig.mk
          sed -i '/^    system_dlkm \\$/d' device/realme/RE6402L1/BoardConfig.mk
          echo "DEVICE_TREE_COMMIT=$(git -C "$GITHUB_WORKSPACE/device_tree" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build recovery
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RE6402L1-eng
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12-RE6402L1
          if-no-files-found: warn
          path: |
            OrangeFox/fox_12.1/out/target/product/RE6402L1/recovery.img
            OrangeFox/fox_12.1/out/target/product/RE6402L1/OrangeFox*.img
            OrangeFox/fox_12.1/out/target/product/RE6402L1/OrangeFox*.zip
            orangefox-build.log